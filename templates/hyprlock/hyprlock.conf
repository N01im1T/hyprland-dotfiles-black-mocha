general { hide_cursor = true }
background { monitor =; color = rgb(000000); blur_passes = 2; blur_size = 6 }
label { monitor =; text = cmd[update:1000] date +"%H:%M"; color = rgb(CDD6F4); font_family = $font; font_size = 72; position = 0, 80; halign = center; valign = center }
label { monitor =; text = cmd[update:60000] date +"%A, %d %B"; color = rgb(A6ADC8); font_family = $font; font_size = 16; position = 0, 15; halign = center; valign = center }
input-field { monitor =; size = 280, 52; outline_thickness = 1; dots_size = 0.22; outer_color = rgb(1A1A1A); inner_color = rgb(070707); font_color = rgb(CDD6F4); fade_on_empty = false; placeholder_text = <span foreground="##A6ADC8">Password</span>; check_color = rgb(B4BEFE); fail_color = rgb(F38BA8); rounding = $radius_large; position = 0, -90; halign = center; valign = center }
